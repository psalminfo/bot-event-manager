<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="toast"></div>
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="https://res.cloudinary.com/dy2hxcyaf/image/upload/v1758305428/Artboard_1bot_logo_2_zwfw2t.png" alt="Company Logo">
            </div>
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#scanner" class="nav-link active"><i data-lucide="scan-line"></i><span>QR Scanner</span></a></li>
                </ul>
            </nav>
        </aside>

        <div class="main-content">
            <header class="main-header">
                <h1 id="page-title">QR Scanner</h1>
                <a href="#" id="logout-btn" class="btn btn-primary" style="margin-left: auto;">Logout</a>
            </header>
            <main>
                <div class="card-grid">
                    <div class="card">
                        <div class="card-content text-center">
                            <h2 class="text-2xl font-bold" id="staff-checkin-count">0</h2>
                            <p class="text-muted-foreground">Tickets Checked In</p>
                        </div>
                    </div>
                </div>
                <div id="scanner" class="page active">
                    <div class="card mt-8">
                        <div class="card-header">
                            <h2 class="card-title">Scan Attendee Ticket</h2>
                        </div>
                        <div class="card-content">
                            <div id="qr-reader" style="width:100%;"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="firebase-init.js"></script>
    <script src="script.js"></script>
</body>
