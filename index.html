<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueOceanTrips All-in-One Scanner & Generator</title>
    <style>
        :root {
            --background: hsl(192, 60%, 95%); /* Light Cyan */
            --foreground: hsl(222, 47%, 11%);
            --card: hsl(0, 0%, 100%);
            --card-foreground: hsl(222, 47%, 11%);
            --popover: hsl(0, 0%, 100%);
            --popover-foreground: hsl(222, 47%, 11%);
            --primary: hsl(197, 71%, 51%); /* Deep Ocean Blue */
            --primary-foreground: hsl(0, 0%, 100%);
            --secondary: hsl(210, 40%, 96.1%);
            --secondary-foreground: hsl(222, 47%, 11%);
            --muted: hsl(210, 40%, 96.1%);
            --muted-foreground: hsl(215, 16%, 47%);
            --accent: hsl(180, 100%, 25%); /* Teal */
            --accent-foreground: hsl(0, 0%, 100%);
            --destructive: hsl(0, 84%, 60%);
            --destructive-foreground: hsl(210, 40%, 98%);
            --border: hsl(214, 32%, 91%);
            --input: hsl(214, 32%, 91%);
            --ring: hsl(197, 71%, 51%);
            --radius: 0.5rem;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
            padding: 1.5rem;
        }
        .container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .card-header { padding: 1.5rem; border-bottom: 1px solid var(--border); background-color: rgba(0,0,0,0.02); }
        .card-header h1 { font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 600; margin: 0; color: var(--card-foreground); }
        .card-header p { margin: 0.25rem 0 0; color: var(--muted-foreground); font-size: 0.875rem; }
        .card-content { padding: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--input);
            border-radius: calc(var(--radius) - 2px);
            background-color: var(--background);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--ring);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: calc(var(--radius) - 2px);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
            font-size: 1rem;
        }
        .btn-primary { background-color: var(--primary); color: var(--primary-foreground); width: 100%; }
        .btn-primary:hover { background-color: hsl(197, 71%, 45%); }
        .btn-secondary { background-color: var(--accent); color: var(--accent-foreground); }
        .btn-secondary:hover { background-color: hsl(180, 100%, 20%); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #qr-reader { width: 100%; border-radius: var(--radius); overflow:hidden; }
        #toast { padding: 1rem; margin-top: 1rem; border-radius: var(--radius); text-align: center; font-weight: 500; display: none; color: white; }
        .toast.success { background-color: #22c55e; }
        .toast.error { background-color: #ef4444; }
        .footer { font-size: 0.875rem; color: var(--muted-foreground); text-align: center; padding: 2rem 1rem; border-top: 1px solid var(--border); }
        #ticket-output-area { margin-top: 2rem; }
        .ticket-card-wrapper { display: flex; justify-content: center; }
        .ticket-card {
            width: 350px;
            aspect-ratio: 9 / 16;
            background-color: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            font-family: 'PT Sans', sans-serif;
        }
        .ticket-header { text-align: center; margin-bottom: 1rem; }
        .ticket-header img { max-width: 150px; margin: 0 auto; }
        .ticket-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem;}
        .ticket-content .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); font-family: 'Poppins', sans-serif;}
        .ticket-content .event-name { font-size: 1.5rem; font-weight: bold; color: var(--card-foreground); font-family: 'Poppins', sans-serif; line-height: 1.2; }
        .ticket-content .qr-image-wrapper { background-color: white; padding: 0.5rem; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin: 1rem 0; }
        .ticket-content .attendee-name { font-size: 2rem; font-weight: bold; font-family: 'Poppins', sans-serif; line-height: 1.1; }
        .ticket-footer { border-top: 2px dashed var(--border); padding-top: 1rem; text-align: center; font-size: 0.75rem; color: var(--muted-foreground); }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Generator Section -->
        <div class="card">
            <div class="card-header">
                <h1>Ticket Generator</h1>
                <p>Fill in the details to create an event ticket.</p>
            </div>
            <div class="card-content">
                <div class="form-group">
                    <label for="event-name">Event Name</label>
                    <input type="text" id="event-name" placeholder="e.g., Annual Tech Conference">
                </div>
                <div class="form-group">
                    <label for="attendee-name">Attendee Name</label>
                    <input type="text" id="attendee-name" placeholder="e.g., John Doe">
                </div>
                 <div class="form-group">
                    <label for="company-logo">Company Logo (Optional, overrides default)</label>
                    <input type="file" id="company-logo" accept="image/*">
                </div>
                <button id="generate-btn" class="btn btn-primary">Generate Ticket</button>
            </div>
        </div>

        <!-- Ticket Display -->
        <div id="ticket-output-area" style="display: none;">
             <div class="ticket-card-wrapper">
                <div id="ticket-card" class="ticket-card">
                    <div class="ticket-header">
                        <img id="ticket-logo-img" src="https://res.cloudinary.com/dy2hxcyaf/image/upload/v1758305428/Artboard_1bot_logo_2_zwfw2t.png" alt="Company Logo">
                    </div>
                    <div class="ticket-content">
                        <div>
                            <p class="label">EVENT</p>
                            <h2 id="ticket-event-name" class="event-name"></h2>
                        </div>
                        <div class="qr-image-wrapper">
                            <img id="ticket-qr-img" src="" alt="QR Code">
                        </div>
                         <div>
                            <p class="label">ATTENDEE</p>
                            <p id="ticket-attendee-name" class="attendee-name"></p>
                        </div>
                    </div>
                    <div class="ticket-footer">
                         <p>For enquiries call or WhatsApp: 08158768689</p>
                    </div>
                </div>
             </div>
             <div style="text-align: center; margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem;">
                <button id="save-btn" class="btn btn-secondary" disabled>Save Ticket as Image</button>
             </div>
        </div>

        <!-- Scanner Section -->
        <div class="card">
            <div class="card-header">
                <h1>QR Code Scanner</h1>
                <p>Scan tickets to record attendance.</p>
            </div>
            <div class="card-content">
                <div id="qr-reader"></div>
                <div id="toast" class="toast"></div>
                 <div id="error-message" style="display: none; color:red; font-weight:bold; text-align:center; margin-top: 1rem;"></div>
            </div>
        </div>

        <div class="footer">
            &copy; 2024 BlueOceanTrips Event Manager
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>

    <script>
        // =================================================================================
        // CONFIGURE YOUR FIREBASE KEYS & STAFF NAME
        // =================================================================================
        const firebaseConfig = {
          "apiKey": "your-api-key",
          "authDomain": "your-auth-domain",
          "projectId": "your-project-id",
          "storageBucket": "your-storage-bucket",
          "messagingSenderId": "your-messaging-sender-id",
          "appId": "your-app-id"
        };

        const SCANNER_OPERATOR_NAME = "STAFF_NAME_HERE"; // IMPORTANT: Change this to the staff member's name
        // =================================================================================

        let db;

        // --- TICKET GENERATOR ---
        const eventNameInput = document.getElementById('event-name');
        const attendeeNameInput = document.getElementById('attendee-name');
        const generateBtn = document.getElementById('generate-btn');
        const saveBtn = document.getElementById('save-btn');
        const ticketOutputArea = document.getElementById('ticket-output-area');
        const companyLogoInput = document.getElementById('company-logo');

        companyLogoInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('ticket-logo-img').src = event.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        generateBtn.addEventListener('click', () => {
            const eventName = eventNameInput.value.trim();
            const attendeeName = attendeeNameInput.value.trim();

            if (!eventName || !attendeeName) {
                alert('Please fill in both Event Name and Attendee Name.');
                return;
            }
            
            const eventId = `${eventName.replace(/\s/g, '')}-${Date.now()}`;
            const attendeeId = `${eventId}-${attendeeName.replace(/\s/g, '')}`;
            
            // This is the data that will be embedded in the QR code for check-in
            const checkinQrData = JSON.stringify({
                name: attendeeName,
                event: eventName,
                id: attendeeId,
            });

            // Use an API to generate the QR code image
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(checkinQrData)}`;

            // Update ticket display
            document.getElementById('ticket-event-name').textContent = eventName;
            document.getElementById('ticket-attendee-name').textContent = attendeeName;
            document.getElementById('ticket-qr-img').src = qrImageUrl;
            
            ticketOutputArea.style.display = 'block';
            saveBtn.disabled = false;
        });
        
        saveBtn.addEventListener('click', async () => {
            const ticketNode = document.getElementById('ticket-card');
            const attendeeName = document.getElementById('attendee-name').value.trim().replace(/\s/g, '_');
            const eventName = document.getElementById('event-name').value.trim().replace(/\s/g, '_');

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                // The library needs a DOM node to convert to an image.
                const blob = await htmlToImage.toBlob(ticketNode, { cacheBust: true, pixelRatio: 2 });
                if (blob) {
                    saveAs(blob, `${eventName}_${attendeeName}_ticket.png`);
                }
            } catch (error) {
                console.error('Oops, something went wrong!', error);
                alert('Could not save image. Please try again.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Ticket as Image';
            }
        });


        // --- SCANNER ---
        const toastElement = document.getElementById('toast');
        let toastTimeout;

        function showToast(message, type = 'success') {
            clearTimeout(toastTimeout);
            toastElement.textContent = message;
            toastElement.className = `toast ${type}`;
            toastElement.style.display = 'block';
            
            toastTimeout = setTimeout(() => {
                toastElement.style.display = 'none';
            }, 4000);
        }

        async function onScanSuccess(decodedText, decodedResult) {
            try {
                // Attempt to parse the scanned text as JSON
                let data;
                try {
                     data = JSON.parse(decodedText);
                } catch(e) {
                     // This happens if the QR code contains a simple string (like a URL)
                     console.warn('Scanned a non-JSON QR code:', decodedText);
                     showToast('This is not a valid event ticket.', 'error');
                     return;
                }
               
                // Check if the parsed data has the fields we expect
                if (data.name && data.event && data.id) {
                    const attendanceRef = db.collection('attendance').doc(data.id);
                    const doc = await attendanceRef.get();

                    if (doc.exists) {
                        console.warn(`Already checked in: ${data.name}`);
                        showToast(`${data.name} has already been scanned.`, 'error');
                    } else {
                        await attendanceRef.set({
                            id: data.id,
                            attendeeName: data.name,
                            eventName: data.event,
                            scannedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            scannedBy: SCANNER_OPERATOR_NAME
                        });
                        console.log(`Scan successful for ${data.name}`);
                        showToast(`Welcome, ${data.name}! Checked in.`, 'success');
                    }
                } else {
                    // The JSON is missing required fields
                    throw new Error('Invalid QR code format for check-in.');
                }
            } catch (error) {
                console.error('Scan processing error:', error);
                showToast('This is not a valid event ticket.', 'error');
            }
        }

        function onScanFailure(error) {
            // This function is called frequently, so we typically leave it empty
            // to avoid spamming the console.
        }
        
        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', (event) => {
            const errorMessageDiv = document.getElementById('error-message');
            if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("your-api-key")) {
                 errorMessageDiv.innerHTML = '<strong>ERROR:</strong> Firebase is not configured. Please edit this HTML file and add your API keys.';
                 errorMessageDiv.style.display = 'block';
                 return;
            }

            try {
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            } catch (e) {
                 errorMessageDiv.innerHTML = `<strong>ERROR:</strong> Firebase initialization failed. Please check your API keys. Details: ${e.message}`;
                 errorMessageDiv.style.display = 'block';
                 return;
            }

            if (!SCANNER_OPERATOR_NAME || SCANNER_OPERATOR_NAME === "STAFF_NAME_HERE") {
                 showToast('Scanner operator name is not set!', 'error');
            }

            // Initialize the QR Code Scanner
            try {
                let html5QrcodeScanner = new Html5QrcodeScanner(
                    "qr-reader", 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    /* verbose= */ false);
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            } catch(e) {
                console.error("Could not start QR Scanner.", e);
                errorMessageDiv.innerHTML = `<strong>ERROR:</strong> Could not start QR scanner. It may not be supported on this browser or device.`;
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
